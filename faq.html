<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How does the whole process work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Four steps. First I build a working demo of your site so you can click through it. Then we refine it together until it feels like your business. Once you are happy, it goes live. Your monthly plan starts the day it launches, and I keep it designed, hosted and supported from there."
      }
    },
    {
      "@type": "Question",
      "name": "Do I have to pay before I see anything?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. You get a real, clickable demo of your website before you commit to anything, and there is no upfront fee at any point. If it is not right for you, you have not spent a dollar."
      }
    },
    {
      "@type": "Question",
      "name": "What does a website cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Essentials is $199 a month and Maximum is $599 a month. There is no build fee. The design, the hosting, the local SEO and the support are all inside that one number."
      }
    },
    {
      "@type": "Question",
      "name": "What is the difference between the two plans?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Essentials covers custom web design, local SEO, hosting and support. Maximum adds ecommerce platforms, expanded bandwidth and priority support, so it suits businesses selling online or carrying heavier traffic."
      }
    },
    {
      "@type": "Question",
      "name": "Why is there no upfront fee?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because the site is leased rather than sold. Instead of a few thousand dollars before a single page exists, the design is part of the monthly rate, and it keeps being part of it: the site gets updated and redesigned as your business changes rather than aging out after launch."
      }
    },
    {
      "@type": "Question",
      "name": "Do you use custom code?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. All websites are custom designed and coded."
      }
    },
    {
      "@type": "Question",
      "name": "What happens to my domain?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Your domain, your content and your Google Business Profile stay registered in your name. The plan covers the site itself: the design, the hosting it runs on, the search work and the support."
      }
    },
    {
      "@type": "Question",
      "name": "How long does it take to build?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Most sites are ready in under a week. Larger projects vary with scope, and you get a realistic timeline before we begin."
      }
    },
    {
      "@type": "Question",
      "name": "What if I already have a website?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "That is fine, and it costs the same. I can redesign it, rebuild it from the ground up, and migrate your existing content and domain over. You end up with something cleaner and easier to manage, without losing what already works."
      }
    },
    {
      "@type": "Question",
      "name": "Do you only work with Michigan businesses?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Michigan small businesses are my focus and my home turf, so you get real support from someone in your time zone. That said, if you are outside Michigan and like how I work, I am glad to talk."
      }
    },
    {
      "@type": "Question",
      "name": "Will my site look good on phones?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Every site is responsive and built to work on phones, tablets and desktops, since most of your visitors will find you on their phone first."
      }
    }
  ]
}
</script>

        <div style="border-bottom: 1px solid rgb(255 255 255 / 0.14);">
          <button onClick="{{ q.toggle }}" aria-expanded="{{ q.open }}" style="display: flex; align-items: center; justify-content: space-between; gap: 24px; width: 100%; text-align: left; padding: clamp(22px, 2.6vw, 34px) 0; background: transparent; border: none; cursor: pointer; color: #f4f4f5; font-family: inherit; font-weight: 300;">

            <span style="font-size: 28px; line-height: 1; flex: 0 0 auto; color: {{ q.signColor }}; transform: {{ q.signRot }}; transition: transform 320ms cubic-bezier(0.34, 1.4, 0.64, 1), color 180ms ease;">+</span>
          </button>
          <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
            <p style="margin: 0; padding: 0 0 clamp(24px, 2.8vw, 36px); max-width: 64ch; font-size: 16px; color: #c9ccd2; line-height: 1.7; text-shadow: 0 2px 16px rgb(4 6 10 / 0.85); text-wrap: pretty;">{{ q.a }}</p>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: 0 };
  QA = [
    ['How does the whole process work?', 'Four steps. First I build a working demo of your site so you can click through it. Then we refine it together until it feels like your business. Once you are happy, it goes live. Your monthly plan starts the day it launches, and I keep it designed, hosted and supported from there.'],

    ['What does a website cost?', 'Essentials is $199 a month and Maximum is $599 a month. There is no build fee. The design, the hosting, the local SEO and the support are all inside that one number.'],
    ['What is the difference between the two plans?', 'Essentials covers custom web design, local SEO, hosting and support. Maximum adds ecommerce platforms, expanded bandwidth and priority support, so it suits businesses selling online or carrying heavier traffic.'],
    ['Why is there no upfront fee?', 'Because the site is leased rather than sold. Instead of a few thousand dollars before a single page exists, the design is part of the monthly rate, and it keeps being part of it: the site gets updated and redesigned as your business changes rather than aging out after launch.'],
    ['Do you use custom code?', 'Yes. All websites are custom designed and coded.'],
    ['What happens to my domain?', 'Your domain, your content and your Google Business Profile stay registered in your name. The plan covers the site itself: the design, the hosting it runs on, the search work and the support.'],
    ['How long does it take to build?', 'Most sites are ready in under a week. Larger projects vary with scope, and you get a realistic timeline before we begin.'],
    ['What if I already have a website?', 'That is fine, and it costs the same. I can redesign it, rebuild it from the ground up, and migrate your existing content and domain over. You end up with something cleaner and easier to manage, without losing what already works.'],
    ['Do you only work with Michigan businesses?', 'Michigan small businesses are my focus and my home turf, so you get real support from someone in your time zone. That said, if you are outside Michigan and like how I work, I am glad to talk.'],
    ['Will my site look good on phones?', 'Yes. Every site is responsive and built to work on phones, tablets and desktops, since most of your visitors will find you on their phone first.'],
  ];
  renderVals() {
    const items = this.QA.map(([q, a], i) => ({
      q, a,
      open: this.state.open === i,
      signColor: this.state.open === i ? '#7bbaf0' : '#5d6066',
      signRot: this.state.open === i ? 'rotate(45deg)' : 'rotate(0deg)',
      toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })),
    }));
    return { items };
  }
}
</script>
